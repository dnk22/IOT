[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_flags =
    -DENABLE_EMBEDDED_PERF_TEST=0
    -DFIRMWARE_GIT_SHA=\"40ff4f3306d6898572dff628bec9edc196df5504\"
lib_deps =
    adafruit/DHT sensor library
    adafruit/Adafruit Unified Sensor
    knolleary/PubSubClient
    bblanchon/ArduinoJson
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library

[env:esp32dev-perf]
extends = env:esp32dev
build_flags =
    -DENABLE_EMBEDDED_PERF_TEST=1
    -DFIRMWARE_GIT_SHA=\"40ff4f3306d6898572dff628bec9edc196df5504\"
